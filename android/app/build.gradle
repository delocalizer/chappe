plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'io.github.delocalizer.chappe'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.delocalizer.chappe'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Copy only the shared modules, never the repository, recordings or user files.
def pythonSources = tasks.register('syncDecoder', Copy) {
    from rootProject.file('..')
    include 'receive.py', 'live_receive.py'
    into layout.buildDirectory.dir('generated/python')
}
chaquopy {
    defaultConfig {
        version = '3.10'
        pip {
            install 'numpy==1.26.2'
            install 'opencv-python==4.5.1.48'
        }
    }
    sourceSets {
        main { srcDir layout.buildDirectory.dir('generated/python').get().asFile }
    }
}
tasks.configureEach {
    if (name.toLowerCase().contains('python')) {
        dependsOn pythonSources
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
}
